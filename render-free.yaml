# Blueprint de Render · PLAN GRATIS (solo para probar, sin método de pago)
#
# Crea: 1 web service Free + 1 base de datos Postgres Free.
# Guía paso a paso: DEPLOY_RENDER_FREE.md
#
# Para usar este archivo, al crear el Blueprint en Render escribe
#   Blueprint Path: render-free.yaml
# (si no, Render usa render.yaml, que es el despliegue de pago).
#
# LIMITACIONES DEL PLAN GRATIS (léelas antes de meter datos reales):
#   - La base de datos Free CADUCA a los 30 días (14 días de gracia para pasarla a pago; después se borra).
#   - Sin disco persistente: fotos, firmas, PDFs de consentimiento y copias se guardan en /tmp
#     y SE PIERDEN cuando el servicio se duerme, se reinicia o se redespliega.
#   - El servicio se duerme tras 15 min sin visitas; la primera visita tarda ~1 min en despertar.
#   - Sin cron jobs: la bandeja «Mensajes de hoy» se prepara cada vez que el servicio arranca
#     (y con el botón «Volver a revisar hoy»). Opcional: un cron externo gratuito (ver la guía).
#   - Sin pre-deploy ni shell: las migraciones se ejecutan al arrancar y la primera cuenta
#     se crea desde la web en /acceso/alta/ con CODIGO_ALTA.
#
# Al crear el Blueprint, Render pedirá los valores marcados con «sync: false»:
#   CORREOS_PERMITIDOS → correos que pueden entrar, separados por comas. El PRIMERO es la propietaria.
#   OPENAI_API_KEY     → opcional; vacío = asistente de IA desactivado.

databases:
  - name: tinta-free-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: estudio
    user: estudio
    ipAllowList: []  # sin acceso desde internet: solo los servicios de Render

services:
  - type: web
    name: tinta-crm-free
    runtime: python
    region: virginia
    plan: free
    buildCommand: bash build.sh
    # Sin preDeployCommand en Free: migrar, preparar contenido y la bandeja del día al arrancar.
    # tareas_diarias es idempotente; si fallara, el servicio arranca igual.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py inicializar_estudio &&
      (python manage.py tareas_diarias || true) &&
      gunicorn estudio.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -
    healthCheckPath: /salud/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: estudio.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: tinta-free-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TAREAS_SECRETO
        generateValue: true
      # Código para crear las cuentas en el primer acceso (/acceso/alta/). Cópialo de Environment.
      - key: CODIGO_ALTA
        generateValue: true
      - key: CORREOS_PERMITIDOS
        sync: false
      # Idioma del contenido para clientes y de las plantillas de partida: es | en.
      # La interfaz se puede cambiar en cualquier momento con el selector ES/EN.
      - key: IDIOMA
        value: es
      # SITE_URL no hace falta: se usa RENDER_EXTERNAL_URL (la URL .onrender.com) automáticamente.
      - key: MEDIA_ROOT
        value: /tmp/media
      - key: COPIAS_ROOT
        value: /tmp/copias
      - key: TIME_ZONE
        value: America/New_York
      - key: REGION_TELEFONO
        value: US
      - key: MONEDA
        value: USD
      - key: SIMBOLO_MONEDA
        value: "$"
      - key: IA_MODELO
        value: gpt-6-luna
      - key: IA_LIMITE_MENSUAL
        value: "100"
      - key: PROXIES_DE_CONFIANZA
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
