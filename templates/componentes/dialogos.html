<dialog id="dialogo-confirmar" class="dialogo" aria-labelledby="dialogo-confirmar-titulo">
  <div class="dialogo-cuerpo">
    <h2 id="dialogo-confirmar-titulo">{% translate "¿Seguro?" %}</h2>
    <p data-texto></p>
    <div class="dialogo-acciones">
      <button type="button" class="btn" data-cerrar>{% translate "Cancelar" %}</button>
      <button type="button" class="btn btn-solido" data-si>{% translate "Sí, continuar" %}</button>
    </div>
  </div>
</dialog>
