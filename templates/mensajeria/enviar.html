<header class="cabecera-pagina">
  <div>
    <nav class="migas" aria-label="Migas"><a href="{% url 'mensajeria:bandeja' %}">Mensajes</a></nav>
    <h1>Enviar a {{ m.cliente.nombre }}</h1>

</header>
<div class="ancho-formulario pila-g">

{% endblock %}
